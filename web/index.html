<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caesar Cipher | Cybersecurity Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="eyebrow">B.Y.T.E CyberSecurity Internship · Task 1</p>
      <h1>Caesar Cipher</h1>
      <p class="subtitle">Encrypt or decrypt text using a configurable shift key.</p>

      <label for="message">Message</label>
      <textarea id="message" placeholder="Enter your message..."></textarea>

      <div class="row">
        <div class="field">
          <label for="key">Shift Key</label>
          <input id="key" type="number" min="1" max="25" value="3">
        </div>
        <div class="actions">
          <button id="encrypt">Encrypt</button>
          <button id="decrypt" class="secondary">Decrypt</button>
        </div>
      </div>

      <div id="error" class="error"></div>

      <label for="result">Result</label>
      <textarea id="result" readonly placeholder="Your result will appear here..."></textarea>

      <div class="info">
        <strong>How it works:</strong> alphabetic characters are shifted by the
        selected key. Spaces, numbers, punctuation, and capitalization are preserved.
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
